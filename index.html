<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #FDF6EC;
  --dot: rgba(45, 27, 0, 0.13);
  --fg: #2D1B00;
  --fg-muted: #8A6A45;
  --card: #FFFFFF;
  --sticker-edge: #FFFFFF;

  --sans: 'Bricolage Grotesque', -apple-system, BlinkMacSystemFont, sans-serif;
  --round: 'Quicksand', var(--sans);

  --ease: cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease-out: cubic-bezier(0.25, 1, 0.5, 1);
}

html { font-size: 16px; -webkit-text-size-adjust: 100%; }

body {
  font-family: var(--sans);
  color: var(--fg);
  background-color: var(--bg);
  /* Dot grid canvas */
  background-image: radial-gradient(circle at 1px 1px, var(--dot) 1.6px, transparent 0);
  background-size: 28px 28px;
  min-height: 100dvh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
}

/* ─────────────────────────────────────────
   Header
   ───────────────────────────────────────── */
.site-header {
  position: relative;
  z-index: 60;
  padding: clamp(24px, 4vw, 44px) clamp(20px, 5vw, 56px) 0;
  pointer-events: none;
}

.site-header > * { pointer-events: auto; }

.wordmark {
  font-family: var(--round);
  font-weight: 700;
  font-size: clamp(1.5rem, 4.2vw, 2.1rem);
  letter-spacing: -0.02em;
  line-height: 1.1;
  display: inline-flex;
  align-items: center;
  gap: 10px;
}

.wordmark .dot-accent {
  width: 11px; height: 11px;
  border-radius: 50%;
  background: #FF8C42;
  display: inline-block;
  flex: none;
  animation: pulseDot 2.6s var(--ease-out) infinite;
}

@keyframes pulseDot {
  0%, 100% { transform: scale(1); opacity: 1; }
  50%      { transform: scale(1.28); opacity: 0.75; }
}

.tagline {
  margin-top: 8px;
  font-size: clamp(0.9rem, 2.4vw, 1.02rem);
  color: var(--fg-muted);
  max-width: 34ch;
  line-height: 1.5;
}

.hint {
  margin-top: 14px;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-size: 0.8rem;
  font-weight: 500;
  color: var(--fg-muted);
  background: rgba(255,255,255,0.72);
  border: 1px solid rgba(45,27,0,0.08);
  padding: 7px 13px;
  border-radius: 999px;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.hint svg { flex: none; opacity: 0.65; }

/* ─────────────────────────────────────────
   Board + Stickers
   ───────────────────────────────────────── */
.board {
  position: relative;
  width: 100%;
  /* Height is set by JS to fit the scatter; this is the floor. */
  min-height: 60vh;
  touch-action: pan-y;
}

.sticker {
  position: absolute;
  top: 0; left: 0;
  width: var(--size, 116px);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 7px;
  cursor: grab;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  /* Depth shadow sits on the wrapper so it wraps the die-cut outline below. */
  filter: drop-shadow(0 5px 7px rgba(45, 27, 0, 0.17));
  transition: filter 0.28s var(--ease-out);
  will-change: transform;
  z-index: 1;
}

.sticker:focus-visible {
  outline: 3px solid #FF8C42;
  outline-offset: 6px;
  border-radius: 14px;
}

.sticker-art {
  width: 100%;
  aspect-ratio: 1;
  object-fit: contain;
  display: block;
  pointer-events: none;
  /* Die-cut white border: stacked hard drop-shadows trace the PNG alpha. */
  filter:
    drop-shadow(0 3px 0 var(--sticker-edge))
    drop-shadow(0 -3px 0 var(--sticker-edge))
    drop-shadow(3px 0 0 var(--sticker-edge))
    drop-shadow(-3px 0 0 var(--sticker-edge))
    drop-shadow(2.2px 2.2px 0 var(--sticker-edge))
    drop-shadow(-2.2px 2.2px 0 var(--sticker-edge))
    drop-shadow(2.2px -2.2px 0 var(--sticker-edge))
    drop-shadow(-2.2px -2.2px 0 var(--sticker-edge));
}

.sticker-label {
  font-family: var(--round);
  font-weight: 600;
  font-size: 0.72rem;
  letter-spacing: 0.01em;
  color: var(--fg);
  background: var(--sticker-edge);
  padding: 4px 11px;
  border-radius: 999px;
  white-space: nowrap;
  pointer-events: none;
  max-width: 128%;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Hover / peel states */
@media (hover: hover) {
  .sticker:hover {
    filter: drop-shadow(0 12px 18px rgba(45, 27, 0, 0.22));
    z-index: 40;
  }
}

.sticker.dragging {
  cursor: grabbing;
  filter: drop-shadow(0 22px 30px rgba(45, 27, 0, 0.28));
  z-index: 50;
}

.sticker.settling { z-index: 40; }

/* ─────────────────────────────────────────
   Hover popup
   ───────────────────────────────────────── */
.popup {
  position: absolute;
  z-index: 70;
  width: 264px;
  background: var(--card);
  border-radius: 18px;
  padding: 16px 17px 15px;
  box-shadow: 0 14px 34px rgba(45, 27, 0, 0.17), 0 2px 6px rgba(45, 27, 0, 0.07);
  opacity: 0;
  visibility: hidden;
  transform: translateY(6px) scale(0.97);
  transition: opacity 0.2s var(--ease-out), transform 0.26s var(--ease), visibility 0.2s;
  pointer-events: none;
}

.popup.visible {
  opacity: 1;
  visibility: visible;
  transform: translateY(0) scale(1);
  pointer-events: auto;
}

.popup-accent {
  width: 30px; height: 4px;
  border-radius: 999px;
  margin-bottom: 11px;
  background: var(--accent, #FF8C42);
}

.popup h3 {
  font-family: var(--round);
  font-weight: 700;
  font-size: 1.04rem;
  letter-spacing: -0.01em;
  margin-bottom: 6px;
}

.popup p {
  font-size: 0.855rem;
  line-height: 1.52;
  color: var(--fg-muted);
  margin-bottom: 12px;
}

.popup-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-bottom: 13px;
}

.popup-tag {
  font-size: 0.66rem;
  font-weight: 500;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  color: var(--fg-muted);
  background: rgba(45, 27, 0, 0.055);
  padding: 3.5px 8px;
  border-radius: 6px;
}

.popup-open {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  width: 100%;
  font-family: var(--round);
  font-weight: 600;
  font-size: 0.86rem;
  color: #fff;
  background: var(--accent, #FF8C42);
  padding: 10px 16px;
  border-radius: 11px;
  text-decoration: none;
  transition: transform 0.18s var(--ease-out), filter 0.18s var(--ease-out);
}

.popup-open:hover { transform: translateY(-1.5px); filter: brightness(1.07); }
.popup-open:active { transform: translateY(0); }
.popup-open svg { transition: transform 0.18s var(--ease-out); }
.popup-open:hover svg { transform: translateX(2.5px); }

/* ─────────────────────────────────────────
   Archer mascot
   ───────────────────────────────────────── */
.archer {
  position: absolute;
  top: 0; left: 0;
  /* Sized from JS to track the current sticker size. */
  width: var(--archer-size, 66px);
  height: var(--archer-size, 66px);
  z-index: 45;
  pointer-events: none;
  will-change: transform;
}

.archer-body { width: 100%; height: 100%; overflow: visible; display: block; }

.archer-shadow {
  position: absolute;
  /* Proportional, and sat just under the body (which ends at ~76% of the box). */
  bottom: 18%; left: 50%;
  width: 50%; height: 9%;
  transform: translateX(-50%);
  background: rgba(45, 27, 0, 0.17);
  border-radius: 50%;
  filter: blur(3px);
}

.archer-bubble {
  position: absolute;
  bottom: 100%;
  left: 50%;
  transform: translate(-50%, -8px) scale(0.9);
  margin-bottom: 4px;
  background: var(--card);
  color: var(--fg);
  font-family: var(--round);
  font-weight: 600;
  font-size: 0.76rem;
  white-space: nowrap;
  padding: 7px 13px;
  border-radius: 13px;
  box-shadow: 0 5px 14px rgba(45, 27, 0, 0.16);
  opacity: 0;
  transition: opacity 0.3s var(--ease-out), transform 0.36s var(--ease);
}

.archer-bubble::after {
  content: '';
  position: absolute;
  top: 100%; left: 50%;
  transform: translateX(-50%);
  border: 6px solid transparent;
  border-top-color: var(--card);
}

.archer-bubble.show {
  opacity: 1;
  transform: translate(-50%, 0) scale(1);
}

/* ─────────────────────────────────────────
   Footer
   ───────────────────────────────────────── */
.site-footer {
  position: relative;
  z-index: 60;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  padding: 28px clamp(20px, 5vw, 56px) 34px;
  font-size: 0.82rem;
  color: var(--fg-muted);
}

.footer-link,
.ghost-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--round);
  font-weight: 600;
  font-size: 0.8rem;
  color: var(--fg);
  text-decoration: none;
  background: rgba(255,255,255,0.78);
  border: 1px solid rgba(45,27,0,0.09);
  padding: 8px 14px;
  border-radius: 999px;
  cursor: pointer;
  transition: transform 0.18s var(--ease-out), background 0.18s var(--ease-out);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.footer-link:hover,
.ghost-btn:hover { transform: translateY(-1.5px); background: #fff; }

.footer-spacer { flex: 1 1 auto; }

@media (max-width: 700px) {
  /* Only 2 columns here, so labels can run wider before risking a collision. */
  .sticker-label { max-width: 160%; font-size: 0.69rem; padding: 4px 9px; }
}

@media (max-width: 640px) {
  body { background-size: 22px 22px; }
  .footer-spacer { display: none; }
  .site-footer { gap: 8px; }
}

@media (prefers-reduced-motion: reduce) {
  .wordmark .dot-accent { animation: none; }
}
</style>

  /* ───────────────────────────────────────
     Storage — a blocked or corrupt store must never break the page
     ─────────────────────────────────────── */
  function loadSaved() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      var parsed = raw ? JSON.parse(raw) : null;
      return (parsed && typeof parsed === 'object') ? parsed : {};
    } catch (e) { return {}; }
  }

  function persist() {
    var out = {};
    stickers.forEach(function (s) {
      if (s.moved) out[s.data.id] = { x: s.x, y: s.y, rot: s.rot };

    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(out)); } catch (e) { /* private mode */ }

     ─────────────────────────────────────── */
  function rand(seed) {
    var x = Math.sin(seed * 127.1 + 311.7) * 43758.5453;
    return x - Math.floor(x);
  }

  function boardMetrics() {
    var w = board.clientWidth;
    var narrow = w < 700;
    var size = narrow ? 84 : (w < 1100 ? 104 : 118);
    var cols = Math.max(2, Math.min(6, Math.floor(w / (size * 1.72))));
    var rows = Math.ceil(PROJECTS.length / cols);
    var cellW = w / cols;
    var cellH = size * (narrow ? 1.68 : 1.76);
    return { w: w, size: size, cols: cols, rows: rows, cellW: cellW, cellH: cellH, narrow: narrow };
  }

  function boardHeight(m) { return m.rows * m.cellH + m.size * 0.8; }

  function defaultLayout(i, m) {
    var col = i % m.cols;
    var row = Math.floor(i / m.cols);
    // Offset alternate rows so the board reads as scattered, not gridded.
    var stagger = (row % 2) * m.cellW * 0.2;
    var jx = (rand(i * 2.17) - 0.5) * m.cellW * 0.24;
    var jy = (rand(i * 3.71) - 0.5) * m.cellH * 0.22;

    var x = col * m.cellW + (m.cellW - m.size) / 2 + stagger + jx;
    var y = row * m.cellH + jy + m.cellH * 0.18;

    // Keep every sticker fully inside the board.
    x = Math.max(8, Math.min(m.w - m.size - 8, x));
    y = Math.max(8, y);

    return { x: x, y: y, rot: (rand(i * 5.31) - 0.5) * 15 };
  }

  /* ───────────────────────────────────────
     Build
     ─────────────────────────────────────── */
  function applyTransform(s, scale) {
    var k = scale || 1;
    s.el.style.transform =
      'translate3d(' + s.x + 'px,' + s.y + 'px,0) rotate(' + s.rot + 'deg) scale(' + k + ')';
  }

  function buildStickers() {
    var m = boardMetrics();

    PROJECTS.forEach(function (p, i) {
      var el = document.createElement('div');
      el.className = 'sticker';
      el.style.setProperty('--size', m.size + 'px');
      el.setAttribute('tabindex', '0');
      el.setAttribute('role', 'button');
      el.setAttribute('aria-label', p.title + ' — ' + p.desc);

      var img = document.createElement('img');
      img.className = 'sticker-art';
      img.src = p.icon;
      img.alt = '';
      img.draggable = false;
      // A missing icon hides its sticker rather than showing a broken frame.
      img.addEventListener('error', function () { el.style.display = 'none'; });

      var label = document.createElement('div');
      label.className = 'sticker-label';
      label.textContent = p.title;

      el.appendChild(img);
      el.appendChild(label);
      board.appendChild(el);

      var base = defaultLayout(i, m);
      var mem = saved[p.id];
      var valid = mem && typeof mem.x === 'number' && typeof mem.y === 'number' &&
                  isFinite(mem.x) && isFinite(mem.y);

      var s = {
        el: el, data: p, index: i,
        x: valid ? mem.x : base.x,
        y: valid ? mem.y : base.y,
        rot: (valid && typeof mem.rot === 'number') ? mem.rot : base.rot,
        moved: !!valid
      };
      stickers.push(s);
      applyTransform(s);
      wireSticker(s);
    });

    board.style.height = boardHeight(m) + 'px';
    syncArcherSize();
  }

  /* ───────────────────────────────────────
     Relayout on resize — dragged stickers keep their spot
     ─────────────────────────────────────── */
  function relayout() {
    var m = boardMetrics();
    board.style.height = boardHeight(m) + 'px';
    syncArcherSize();

    stickers.forEach(function (s, i) {
      s.el.style.setProperty('--size', m.size + 'px');
      if (!s.moved) {
        var base = defaultLayout(i, m);
        s.x = base.x; s.y = base.y; s.rot = base.rot;
      } else {
        // Pull a dragged sticker back into view if the window shrank.
        s.x = Math.max(4, Math.min(m.w - m.size - 4, s.x));
        s.y = Math.max(4, Math.min(board.clientHeight - m.size - 4, s.y));
      }
      applyTransform(s);
    });
    hidePopup(true);
    clampArcher();
  }

  var resizeTimer;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(relayout, 160);
  });

  /* ───────────────────────────────────────
     Popup
     ─────────────────────────────────────── */
  function showPopup(s) {
    clearTimeout(popupHideTimer);
    activePopupFor = s;
    var p = s.data;

    document.getElementById('popup-title').textContent = p.title;
    document.getElementById('popup-desc').textContent = p.desc;
    document.getElementById('popup-accent').style.background = p.accent;

    var tagWrap = document.getElementById('popup-tags');
    tagWrap.textContent = '';
    p.tags.forEach(function (t) {
      var tag = document.createElement('span');
      tag.className = 'popup-tag';
      tag.textContent = t;
      tagWrap.appendChild(tag);
    });

    var openBtn = document.getElementById('popup-open');
    openBtn.href = p.link;
    openBtn.style.setProperty('--accent', p.accent);

    // Make it measurable before positioning, then place it.
    popup.classList.add('visible');
    positionPopup(s);
  }

  function positionPopup(s) {
    var size = parseFloat(getComputedStyle(s.el).getPropertyValue('--size')) || 116;
    var pw = popup.offsetWidth || 264;
    var ph = popup.offsetHeight || 210;
    var gap = 14;

    // Prefer the right of the sticker; flip left when it would overflow the viewport.
    var x = s.x + size + gap;
    var boardLeft = board.getBoundingClientRect().left;
    if (boardLeft + x + pw > window.innerWidth - 10) x = s.x - pw - gap;
    x = Math.max(10, Math.min(board.clientWidth - pw - 10, x));

    var y = s.y + size / 2 - ph / 2;
    y = Math.max(6, Math.min(board.clientHeight - ph - 6, y));

    popup.style.left = x + 'px';
    popup.style.top = y + 'px';
  }

  function hidePopup(immediate) {
    clearTimeout(popupHideTimer);
    if (immediate) {
      popup.classList.remove('visible');
      activePopupFor = null;
      return;
    }
    // Grace period so the cursor can travel from sticker into the popup.
    popupHideTimer = setTimeout(function () {
      popup.classList.remove('visible');
      activePopupFor = null;
    }, 180);
  }

  popup.addEventListener('mouseenter', function () { clearTimeout(popupHideTimer); });
  popup.addEventListener('mouseleave', function () { hidePopup(); });

  /* ───────────────────────────────────────
     Sticker interaction: hover, peel, drag
     ─────────────────────────────────────── */
  function wireSticker(s) {
    var el = s.el;
    var pressed = false, dragging = false, pointerId = null;
    var startX = 0, startY = 0, originX = 0, originY = 0, originRot = 0;

    el.addEventListener('mouseenter', function () { if (!dragging) showPopup(s); });
    el.addEventListener('mouseleave', function () { if (!dragging) hidePopup(); });

    // Keyboard: focus reveals the popup, Enter/Space opens the project.
    el.addEventListener('focus', function () { showPopup(s); });
    el.addEventListener('blur', function () { hidePopup(); });
    el.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        window.open(s.data.link, '_blank', 'noopener');
      }
    });

    el.addEventListener('pointerdown', function (e) {
      if (e.button != null && e.button !== 0) return;
      pressed = true;
      pointerId = e.pointerId;
      startX = e.clientX; startY = e.clientY;
      originX = s.x; originY = s.y; originRot = s.rot;
    });

    el.addEventListener('pointermove', function (e) {
      if (!pressed || e.pointerId !== pointerId) return;

      var dx = e.clientX - startX;
      var dy = e.clientY - startY;

      if (!dragging) {
        if (Math.abs(dx) < DRAG_THRESHOLD && Math.abs(dy) < DRAG_THRESHOLD) return;
        dragging = true;                    // threshold crossed — start the peel
        el.classList.add('dragging');
        try { el.setPointerCapture(pointerId); } catch (err) { /* ignore */ }
        hidePopup(true);
      }

      e.preventDefault();
      s.x = originX + dx;
      s.y = originY + dy;
      // Tilt into the direction of travel — this is the "peel".
      s.rot = originRot + Math.max(-9, Math.min(9, dx * 0.035));
      applyTransform(s, 1.07);
    });

    function endDrag() {
      if (!pressed) return;
      pressed = false;
      if (!dragging) { pointerId = null; return; }

      dragging = false;
      el.classList.remove('dragging');
      el.classList.add('settling');
      try {
        if (pointerId !== null && el.hasPointerCapture(pointerId)) el.releasePointerCapture(pointerId);
      } catch (err) { /* ignore */ }
      pointerId = null;

      // Clamp inside the board so a sticker can never be lost off-canvas.
      var m = boardMetrics();
      s.x = Math.max(4, Math.min(m.w - m.size - 4, s.x));
      s.y = Math.max(4, Math.min(board.clientHeight - m.size - 4, s.y));
      s.moved = true;

      if (window.gsap && !reduced) {
        var box = { k: 1.07 };
        gsap.to(box, {
          k: 1, duration: 0.5, ease: 'elastic.out(1, 0.55)',
          onUpdate: function () { applyTransform(s, box.k); },
          onComplete: function () { applyTransform(s); el.classList.remove('settling'); }
        });
      } else {
        applyTransform(s);
        el.classList.remove('settling');
      }

      persist();
      speak(pick(DROP_LINES));
    }

    el.addEventListener('pointerup', endDrag);
    el.addEventListener('pointercancel', endDrag);

    el.addEventListener('click', function (e) {
      // A press that turned into a drag is not a click.
      if (el.classList.contains('dragging') || el.classList.contains('settling')) {
        e.preventDefault();
        return;
      }
      // Touch has no hover, so the first tap reveals the popup instead of navigating.
      if (touchOnly && activePopupFor !== s) {
        showPopup(s);
        return;
      }
      window.open(s.data.link, '_blank', 'noopener');
    });
  }

  // Tapping bare canvas dismisses the popup.
  board.addEventListener('pointerdown', function (e) {
    if (e.target === board) hidePopup(true);
  });

  /* ───────────────────────────────────────
     Tidy up — restore the original scatter
     ─────────────────────────────────────── */
  document.getElementById('tidy-btn').addEventListener('click', function () {
    var m = boardMetrics();
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) { /* ignore */ }
    hidePopup(true);

    stickers.forEach(function (s, i) {
      var base = defaultLayout(i, m);
      s.moved = false;
      if (window.gsap && !reduced) {
        gsap.to(s, {
          x: base.x, y: base.y, rot: base.rot,
          duration: 0.7, ease: 'power3.inOut', delay: i * 0.022,
          onUpdate: function () { applyTransform(s); }
        });
      } else {
        s.x = base.x; s.y = base.y; s.rot = base.rot;
        applyTransform(s);
      }
    });
    speak('All tidy. ✨');
  });

  /* ───────────────────────────────────────
     Archer — the wandering mascot
     ─────────────────────────────────────── */
  var IDLE_LINES = [
    'Peel one off!', 'Drag me a friend.', "That one's my favourite.",
    'Still building…', 'Try hovering.', 'Made with too much coffee.',
    'Beep. Boop. Hi.', 'Sixteen and counting.'
  ];
  var DROP_LINES = ['Nice spot!', 'Ooh, sticky.', 'Looks good there.', 'Peeled clean.'];

  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }

  var bubble = document.getElementById('archer-bubble');
  var bubbleTimer;

  function speak(text) {
    if (!bubble || reduced) return;
    clearTimeout(bubbleTimer);
    bubble.textContent = text;
    bubble.classList.add('show');
    bubbleTimer = setTimeout(function () { bubble.classList.remove('show'); }, 2600);
  }

  var ax = 0, ay = 0;
  var archerSize = 66;

  // Archer matches the sticker size so he reads as one of the crowd, not a bug on the board.
  function syncArcherSize() {
    archerSize = boardMetrics().size;
    archer.style.setProperty('--archer-size', archerSize + 'px');
  }

  function placeArcher(x, y) {
    ax = x; ay = y;
    archer.style.transform = 'translate3d(' + ax + 'px,' + ay + 'px,0)';
  }

  function clampArcher() {
    var m = boardMetrics();
    placeArcher(
      Math.max(8, Math.min(m.w - archerSize - 8, ax)),
      Math.max(8, Math.min(board.clientHeight - archerSize - 8, ay))
    );
  }

  function archerHome() {
    var m = boardMetrics();
    placeArcher((m.w - archerSize) / 2, Math.max(40, board.clientHeight - archerSize - 44));
  }

  function wander() {
    var m = boardMetrics();
    var tx = 20 + Math.random() * Math.max(20, m.w - archerSize - 40);
    var ty = 20 + Math.random() * Math.max(20, board.clientHeight - archerSize - 40);
    var dur = Math.min(5.5, Math.max(2.2, Math.hypot(tx - ax, ty - ay) / 90));

    // Face the direction of travel.
    var svg = document.getElementById('archer-svg');
    if (svg) svg.style.transform = (tx < ax) ? 'scaleX(-1)' : 'scaleX(1)';

    var pos = { x: ax, y: ay };
    gsap.to(pos, {
      x: tx, y: ty, duration: dur, ease: 'sine.inOut',
      onUpdate: function () { placeArcher(pos.x, pos.y); },
      onComplete: function () {
        if (Math.random() < 0.4) speak(pick(IDLE_LINES));
        setTimeout(wander, 1200 + Math.random() * 3200);
      }
    });
  }

  function animateArcher() {
    if (!window.gsap || reduced) return;
    // Hover bob, fins flapping from where they meet the body, periodic blink.
    gsap.to('#archer-torso', { y: -3, duration: 1.3, ease: 'sine.inOut', yoyo: true, repeat: -1 });
    gsap.to('#fin-left',  { rotation: -11, transformOrigin: '34px 54px', duration: 1.5, ease: 'sine.inOut', yoyo: true, repeat: -1 });
    gsap.to('#fin-right', { rotation:  11, transformOrigin: '66px 54px', duration: 1.5, ease: 'sine.inOut', yoyo: true, repeat: -1, delay: 0.3 });
    gsap.to('#archer-eyes', {
      scaleY: 0.12, transformOrigin: '50% 50%', duration: 0.09,
      repeat: -1, repeatDelay: 3.6, yoyo: true
    });
  }

  /* ───────────────────────────────────────
     Boot
     ─────────────────────────────────────── */
  buildStickers();
  archerHome();
  animateArcher();

  if (window.gsap && !reduced) {
    // Stickers drop onto the board.
    stickers.forEach(function (s, i) {
      gsap.from(s.el, {
        opacity: 0, scale: 0.7, duration: 0.55,
        delay: 0.05 + i * 0.035, ease: 'back.out(1.7)'
      });
    });
    setTimeout(wander, 1800);
    setTimeout(function () { speak("Hi — I'm Archer 👋"); }, 900);
  }
})();
</script>

</body>
</html>
